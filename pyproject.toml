[project]
name = "high-throughput-inference"
version = "0.1.0"
description = "A fast API inference engine wrapping llama-cpp-python for local deployment with Prometheus metrics."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "google-genai>=0.1.0",
    "prometheus-client>=0.20.0",
    "aiohttp>=3.9.5",
    "gradio>=6.29.0",
    "requests>=2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]
